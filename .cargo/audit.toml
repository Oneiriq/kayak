# The advisories this repository knowingly carries, each with the
# reason it cannot come out yet and the condition that retires it.
# It arrived with the `verify` feature, whose EXPLAIN probe is the
# first thing to put a database client in this crate's lockfile. The
# advisory lives in the engine SDK's transitive tree, not in code
# this crate compiles or runs. Mirrors the file surql-rs carries for
# the same tree.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa: Marvin timing sidechannel) has no fixed
    # release. It reaches the lockfile through the engine's JWT stack,
    # `jsonwebtoken -> surrealdb-core -> surrealdb`. The attack times
    # an in-process RSA private-key operation; kayak performs none:
    # the verify feature opens a session and runs EXPLAIN, it neither
    # signs nor holds keys. Re-evaluate whenever surrealdb or
    # jsonwebtoken move off the unfixed crate.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387 (crypto-bigint < 0.7.6: timing variability in
    # operations meant to be constant-time) reaches the lockfile through
    # the same JWT stack, `crypto-bigint 0.5.5 -> elliptic-curve 0.13
    # -> p256 / p384 -> jsonwebtoken 10 -> surrealdb-core 4.0.0`. The
    # fix is in the 0.7 line, and elliptic-curve 0.13 takes only 0.5,
    # so no compatible update exists. Only the embedded engine pulls it
    # in, and here that is the test-only `kv-mem` dev-dependency:
    # `cargo tree -i crypto-bigint -e normal --all-features` prints
    # nothing, so no shipped build compiles it. The tests sign and
    # verify no ECDSA token. Remove the entry when jsonwebtoken (or
    # surrealdb-core) moves to an elliptic-curve on crypto-bigint 0.7.
    "RUSTSEC-2026-0387",
]

# The move to surrealdb 4.0 retired RUSTSEC-2026-0194 and -0195
# (quick-xml < 0.41): surrealdb-core 4.0.0 takes object_store 0.14,
# which takes quick-xml 0.41. Mirrors surql-rs.
