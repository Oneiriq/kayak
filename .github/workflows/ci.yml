name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # A run that nothing pushed. Two things need it: an outage that
  # abandons a run mid-flight, where the commit is already on main and
  # there is nothing left to push at it, and drift arriving without a
  # commit, which is how a new advisory reddens a branch that has not
  # changed. Without this the only way to re-run CI was another
  # commit, and `gh workflow run` answered 422.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    # Stated as what it refuses, so an event added later runs by
    # default. Written the other way around, a dispatched run would
    # match neither arm and skip every job while reporting success.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-kayak-stable"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # Both test builds compile SurrealDB 4's embedded engine (the
      # test-only `kv-mem` dev-dependency). At full width with debuginfo
      # that OOM-kills the aur0 runner pod and the job ends without a
      # log ("the runner lost communication"), as it does in surql-rs:
      # one compile at a time and no debuginfo keep it inside the pod.
      # The two steps share the profile so the second reuses what it can.
      - name: cargo test
        run: cargo test --all-features
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

      # The build a contributor runs first, and the one the README's
      # re-bless lines use. --all-features alone let two test files
      # reach a console-only item ungated, so plain `cargo test` did not
      # compile while every run here stayed green.
      - name: cargo test (default features)
        run: cargo test
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"

      - name: Dependency audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"               | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          fi
          cargo audit
