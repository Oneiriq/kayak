name: Publish to crates.io

# Mirrors Oneiriq/surql-rs's and Oneiriq/chine's `publish.yml`: it fires on a
# published GitHub Release (or a manual dispatch), re-verifies the tagged
# commit, then publishes `oneiriq-kayak` to crates.io behind a human-approved
# environment gate.
#
# crates.io has no staging registry, so:
#   * a prerelease Release, or a `dry-run` dispatch, runs `verify` only
#     (packages + `cargo publish --dry-run`, uploads nothing);
#   * a normal Release, or a `crates-io` dispatch, runs verify -> approval
#     (the `crates-io-approval` environment gate) -> publish.
#
# The verify gates are ci.yml's, run on ubuntu-latest: a token publish needs
# no self-hosted resources.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - crates-io

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo pkgid | sed -E 's/.*[#@]([^@#]+)$/\1/')"
          echo "Tag version:   $TAG_VERSION"
          echo "Crate version: $CRATE_VERSION"
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo test (default features)
        run: cargo test

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: cargo publish --dry-run
        run: cargo publish --dry-run

      # The rust-cache post step walks target/ after the job and treats the
      # package-verification dir cargo leaves behind as a workspace, so its
      # probes land as failure-level annotations on a succeeding job. The dir
      # has served its purpose by now.
      - name: Drop the package-verification dir
        run: rm -rf target/package

  approval:
    name: Approve crates.io publish
    needs: verify
    # Only the real-publish path: a normal Release, or an explicit `crates-io`
    # dispatch. A prerelease Release or a `dry-run` dispatch stops after verify.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'crates-io') ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    # `crates-io-approval` is a GitHub Environment; add required reviewers in
    # the repo settings to make this job wait on human sign-off before publish.
    environment:
      name: crates-io-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: echo "Awaiting approval to publish to crates.io..."

  publish:
    name: Publish to crates.io
    needs: approval
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/oneiriq-kayak
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # cargo reads the token from the environment, which keeps it off the
      # command line.
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Drop the package-verification dir
        run: rm -rf target/package
