[package]
name = "oneiriq-kayak"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Contract layer for SurrealDB-backed APIs: one serializable IR over surql-rs schema definitions, validated against real indexes, generating every API surface."
license = "Apache-2.0"
repository = "https://github.com/Oneiriq/kayak"
authors = ["Shon Thomas <shonpt@outlook.com>"]
readme = "README.md"
keywords = ["surrealdb", "openapi", "graphql", "codegen", "api"]
categories = ["development-tools", "web-programming", "database"]
# Brand images are for the repository page; the crate does not need them.
exclude = ["/assets"]

# docs.rs builds default features only unless told otherwise, which would
# leave the runtime, GraphQL, console, and verify APIs undocumented.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "kayak"

[[bin]]
name = "kayak"
path = "src/bin/kayak.rs"

[features]
default = []
# The contract, executed: resolver registry, middleware chain,
# contract-enforcing dispatcher. No heavy dependencies.
runtime = []
# The live GraphQL face over the runtime (async-graphql dynamic schema).
graphql = ["runtime", "dep:async-graphql"]
# The contract-driven operator console renderer over the runtime.
console = ["runtime", "dep:maud"]
# Plan verification against a live database: EXPLAIN every filter and
# sort claim and refuse the ones the planner answers with a table
# walk. Kayak itself carries no database client, so the client
# rides this gate the way async-graphql rides `graphql`; CI runs
# --all-features, which keeps the gated half compiled and tested.
verify = ["oneiriq-surql/client-rustls", "dep:tokio"]

[dependencies]
async-graphql = { version = "7", optional = true, features = ["dynamic-schema"] }
# The Stream trait alone, so a watch resolver has a return type without
# pulling an executor or a combinator library into the runtime.
futures-core = "0.3"
maud = { version = "0.27", optional = true }
oneiriq-surql = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# Only the runtime handle the CLI needs to drive the async client from
# a synchronous main; everything heavier arrives through the client.
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Feature-unifies `kv-mem` into the client's `surrealdb` so the verify
# tests can run a real embedded engine (`mem://`) without a server.
# Test-only; the shipped feature set stays ws-only.
surrealdb = { version = "3.0", default-features = false, features = ["kv-mem"] }

